name: Publish Android apps

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to publish
        type: choice
        options: [all, wahoo-share, weather]
        default: all
      revision:
        description: Exact source commit (requires selecting one app)
        type: string
        default: ''
      release_version:
        description: App release version (major.minor.patch)
        type: string
        default: ''
      force:
        description: Rebuild both apps even when source revisions are unchanged
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fdroid-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned toolchain
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          make check
      - name: Restore private signing files and read-only source access
        env:
          APP_KEYSTORE: ${{ secrets.APP_KEYSTORE }}
          REPO_KEYSTORE: ${{ secrets.REPO_KEYSTORE }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
        run: |
          umask 077
          mkdir -p private
          printf '%s' "$APP_KEYSTORE" | base64 --decode > private/app.keystore
          printf '%s' "$REPO_KEYSTORE" | base64 --decode > private/repo.keystore
          printf '%s' "$REPO_PASSWORD" > private/repo-password
          printf '%s' 'android' > private/app-password
          printf '%s\n' "$SOURCE_SSH_KEY" > private/source-key
          printf 'GIT_SSH_COMMAND=ssh -i %s/private/source-key -o IdentitiesOnly=yes -o UserKnownHostsFile=%s/github-known-hosts -o StrictHostKeyChecking=yes\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore latest publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("repo-")))][0].tagName // empty')
          if [ -n "$tag" ]; then
            mkdir -p work/restore
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern repository.zip --dir work/restore
            .venv/bin/python scripts/restore.py work/restore/repository.zip previous
          fi
      - name: Test, build, sign and index
        id: build
        env:
          FORCE_BUILD: ${{ inputs.force }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          args=()
          if [ "$FORCE_BUILD" = 'true' ]; then args+=(--force); fi
          if [ -n "$RELEASE_APP" ] && [ "$RELEASE_APP" != 'all' ]; then args+=(--app "$RELEASE_APP"); fi
          if [ -n "$RELEASE_REVISION" ]; then args+=(--revision "$RELEASE_REVISION"); fi
          if [ -n "$RELEASE_VERSION" ]; then args+=(--release-version "$RELEASE_VERSION"); fi
          .venv/bin/python scripts/publish.py "${args[@]}"
      - name: Save durable publication
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "repo-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" repository.zip \
            --repo "$GITHUB_REPOSITORY" --title "Android apps ${GITHUB_RUN_NUMBER}" \
            --notes 'Signed F-Droid repository snapshot. The install URL is in the repository README.'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.build.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.build.outputs.changed == 'true'
        with:
          path: public
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.build.outputs.changed == 'true'
        id: deployment
      - name: Remove private files
        if: always()
        run: rm -rf private work/fdroid/config.yml
